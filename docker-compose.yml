services:
  # --- SERVIÇO 1: OLLAMA (O Motor da IA) ---
  ollama:
    image: ollama/ollama:latest
    container_name: alde-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # --- SERVIÇO 2: COMPILADOR DO MODELO (Roda uma vez e morre) ---
  ollama-setup:
    image: ollama/ollama:latest
    container_name: alde-ollama-setup
    volumes:
      - ollama_data:/root/.ollama
      - .:/tmp/project
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: >
      -c "echo 'Aguardando o Ollama iniciar...';
          while ! curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
          echo 'Ollama online. Baixando os modelos e criando o ALDE...';
          ollama pull qwen3-coder-next;
          ollama pull qwen2.5-coder:1.5b;
          ollama create alde -f /tmp/project/Modelfile;
          echo 'Modelos configurados com sucesso!';"

  # --- SERVIÇO 3: SUA API FASTAPI (A Aplicação) ---
  alde-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alde-api-service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama-setup:
        condition: service_completed_successfully

volumes:
  ollama_data:
    driver: local