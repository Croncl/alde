# =============================================================================
# ALDE – Assistente Linux de Diagnóstico e Execução
# Pipeline de CI/CD — GitHub Actions
# =============================================================================

name: ALDE CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Qualidade do Código e Testes Automatizados
  # ---------------------------------------------------------------------------
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Otimiza o tempo de build cacheando os downloads do pip

      - name: Instalar Dependências de Desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt

      - name: Executar Linting e Formatação (Ruff)
        run: |
          # Verifica se o código segue as boas práticas e formatação estrita
          ruff check .
          ruff format --check .

      - name: Checagem de Tipos Estática (Mypy)
        run: |
          # Garante a integridade dos tipos anotados no projeto
          mypy app/

      - name: Executar Testes com Cobertura (Pytest)
        env:
          # Injeta variáveis de ambiente fakes para os testes não quebrarem
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: qwen3-coder-next
          PORT: 8000
        run: |
          # Executa a suíte de testes e gera relatório de cobertura
          pytest --cov=app tests/ --cov-report=xml

  # ---------------------------------------------------------------------------
  # JOB 2: Build e Publicação da Imagem Docker (Apenas em Push na Main)
  # ---------------------------------------------------------------------------
  build-and-publish:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar QEMU (Suporte multi-plataforma)
        uses: actions/github-actions/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: actions/github-actions/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: actions/github-actions/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir e Publicar Imagem Docker
        uses: actions/github-actions/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/alde-api:latest
            ${{ secrets.DOCKER_USERNAME }}/alde-api:${{ github.sha }}